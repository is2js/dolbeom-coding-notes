name: Check lecture notes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pages_base: ['/', '/pages-path-check/']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test authoring and course data
        run: npm test
      - name: Check lecture duration
        run: npm run check:content
      - name: Build and verify Pages path
        env:
          PAGES_BASE_PATH: ${{ matrix.pages_base }}
        run: |
          npm run build
          npm run check:dist
