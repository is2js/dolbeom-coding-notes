<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="css-title css-desc">
  <title id="css-title">CSS 선택자와 선언</title>
  <desc id="css-desc">점 card는 class가 card인 요소를 고르는 선택자이고 padding은 안쪽 여백 속성, 24px은 값입니다. 같은 카드의 바깥 경계와 내용 사이에 여백이 생깁니다.</desc>
  <defs><linearGradient id="desk" x2=".8" y2="1"><stop stop-color="#fbf3df"/><stop offset="1" stop-color="#efe2c7"/></linearGradient><pattern id="grid" x="380" y="255" width="84" height="48" patternUnits="userSpaceOnUse" viewBox="0 0 84 48"><path d="M0 0 84 48M0 48 84 0" fill="none" stroke="#baa783" stroke-width="1.05"/></pattern></defs><rect x="2" y="2" width="756" height="546" rx="20" fill="url(#desk)" stroke="#c5b798" stroke-width="2"/><rect x="14" y="14" width="732" height="522" rx="14" fill="url(#grid)" opacity=".38"/>
  <text x="380" y="61" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="32" font-weight="750" text-anchor="middle">어떤 요소의 무엇을 바꿀까요?</text><text x="380" y="98" fill="#536964" font-family="Malgun Gothic,system-ui,sans-serif" font-size="20" font-weight="550" text-anchor="middle">선택자와 선언을 읽으면 바뀌는 부분을 찾을 수 있습니다</text>
  <polygon points="59,130 71,123.14 699,123.14 687,130" fill="#fff8e9" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="687,130 699,123.14 699,217.14 687,224" fill="#aab6a5" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><rect x="59" y="130" width="628" height="94" rx="7" fill="#fff8e7" stroke="#2e4050" stroke-width="2.2"/>
  <text x="167" y="169" fill="#316f68" font-family="Consolas,monospace" font-size="32" font-weight="600" text-anchor="middle">.card</text>
  <text x="259" y="169" fill="#2e4050" font-family="Consolas,monospace" font-size="33" font-weight="600" text-anchor="middle">{</text>
  <text x="398" y="169" fill="#2e4050" font-family="Consolas,monospace" font-size="32" font-weight="600" text-anchor="middle">padding:</text>
  <text x="562" y="169" fill="#97632e" font-family="Consolas,monospace" font-size="32" font-weight="600" text-anchor="middle">24px;</text>
  <text x="646" y="169" fill="#2e4050" font-family="Consolas,monospace" font-size="33" font-weight="600" text-anchor="middle">}</text>
  <text x="167" y="205" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="21" font-weight="600" text-anchor="middle">선택자</text>
  <text x="398" y="205" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="21" font-weight="600" text-anchor="middle">속성</text>
  <text x="562" y="205" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="21" font-weight="600" text-anchor="middle">값</text>
  <polygon points="151,339 382,471 382,481 151,349" fill="#c1ad8f" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="382,471 613,339 613,349 382,481" fill="#a8987d" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="382,207 613,339 382,471 151,339" fill="#dce9d4" stroke="#847e66" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="129,272 141,265.14 622,265.14 610,272" fill="#fff8e9" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="610,272 622,265.14 622,433.14 610,440" fill="#aab6a5" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><rect x="129" y="272" width="481" height="168" rx="7" fill="#dce9d4" stroke="#2e4050" stroke-width="2.2"/>
  <rect x="192" y="324" width="354" height="65" rx="8" fill="#fff8e7" stroke="#688775" stroke-width="2"/>
  <text x="369" y="365" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="27" font-weight="750" text-anchor="middle">Git 카드의 내용</text>
  <path d="M136 357h49m-49-8v16m49-16v16M369 280v37m-8-37h16m-16 37h16" fill="none" stroke="#9b692f" stroke-width="2.6"/>
  <text x="521" y="306" fill="#97632e" font-family="Consolas,monospace" font-size="21" font-weight="600" text-anchor="middle">24px</text>
  <text x="380" y="505" fill="#316f68" font-family="Malgun Gothic,system-ui,sans-serif" font-size="22" font-weight="600" text-anchor="middle">padding은 카드 테두리와 내용 사이의 안쪽 여백입니다</text>
</svg>
