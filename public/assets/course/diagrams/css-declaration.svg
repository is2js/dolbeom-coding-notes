<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="css-title css-desc">
  <title id="css-title">CSS 선택자와 선언</title>
  <desc id="css-desc">점 card는 class가 card인 요소를 고르는 선택자이고 padding은 안쪽 여백 속성, 24px은 값입니다. 같은 카드의 바깥 경계와 내용 사이에 여백이 생깁니다.</desc>
  <rect x="2" y="2" width="756" height="546" rx="22" fill="#f2e6ce" stroke="#25334b" stroke-width="3"/>
  <g fill="#25334b" stroke="none" font-family="Pretendard,Malgun Gothic,system-ui,sans-serif" text-anchor="middle"><text x="380" y="58" font-size="32" font-weight="700">어떤 요소의 무엇을 바꿀까요?</text></g>
  <rect x="35" y="95" width="690" height="99" rx="14" fill="#fffaf0" stroke="#25334b" stroke-width="3"/>
  <g font-family="Consolas,IBM Plex Mono,monospace" font-size="36" text-anchor="middle" stroke="none"><text x="130" y="157" fill="#287d7b">.card</text><text x="253" y="157" fill="#25334b">{</text><text x="390" y="157" fill="#25334b">padding:</text><text x="575" y="157" fill="#a46e2e">24px;</text><text x="683" y="157" fill="#25334b">}</text></g>
  <g fill="#25334b" stroke="none" font-family="Pretendard,Malgun Gothic,system-ui,sans-serif" font-size="27" text-anchor="middle"><text x="130" y="235">선택자</text><text x="390" y="235">속성</text><text x="575" y="235">값</text></g>
  <g fill="none" stroke="#287d7b" stroke-width="3"><path d="M130 196v14M390 196v14M575 196v14"/></g>
  <rect x="91" y="278" width="578" height="182" rx="17" fill="#dce8d6" stroke="#25334b" stroke-width="3"/>
  <rect x="143" y="330" width="474" height="78" rx="10" fill="#fffaf0" stroke="#25334b" stroke-width="2.5"/>
  <text x="380" y="380" font-family="Pretendard,Malgun Gothic,system-ui,sans-serif" fill="#25334b" stroke="none" text-anchor="middle" font-size="32" font-weight="700">Git 카드의 내용</text>
  <g fill="none" stroke="#a46e2e" stroke-width="4" stroke-linecap="round"><path d="M95 314h44m-44-6v12m44-12v12M380 282v43m-6-43h12m-12 43h12"/></g>
  <text x="485" y="316" font-family="Consolas,IBM Plex Mono,monospace" fill="#25334b" stroke="none" text-anchor="middle" font-size="27">padding: 24px</text>
  <text x="380" y="509" font-family="Pretendard,Malgun Gothic,system-ui,sans-serif" fill="#25334b" stroke="none" text-anchor="middle" font-size="27">안쪽 여백은 카드 경계와 내용 사이입니다</text>
</svg>
