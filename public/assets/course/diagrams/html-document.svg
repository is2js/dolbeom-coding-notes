  <text x="448" y="330" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">article.card</text>
  <text x="467" y="359" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">h1 → Git</text>
  <text x="467" y="388" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">button</text>
  <text x="467" y="417" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">p → 설명</text>
  <text x="194" y="529" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="23" font-weight="700" text-anchor="middle">문서를 위한 정보</text>
  <text x="553" y="529" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="23" font-weight="700" text-anchor="middle">페이지 안의 내용</text>
