<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="document-title document-desc">
  <title id="document-title">HTML 문서의 head와 body</title>
  <desc id="document-desc">html 안에 문서 정보인 head와 화면 내용인 body가 있습니다. title은 브라우저 탭 제목이고 body의 article 안에는 화면 제목 h1, button, p가 놓입니다.</desc>
  <defs><linearGradient id="desk" x2=".8" y2="1"><stop stop-color="#fbf3df"/><stop offset="1" stop-color="#efe2c7"/></linearGradient><pattern id="grid" x="380" y="255" width="84" height="48" patternUnits="userSpaceOnUse" viewBox="0 0 84 48"><path d="M0 0 84 48M0 48 84 0" fill="none" stroke="#baa783" stroke-width="1.05"/></pattern></defs><rect x="2" y="2" width="756" height="546" rx="20" fill="url(#desk)" stroke="#c5b798" stroke-width="2"/><rect x="14" y="14" width="732" height="522" rx="14" fill="url(#grid)" opacity=".38"/>
  <text x="380" y="61" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="32" font-weight="750" text-anchor="middle">문서 정보와 화면 내용을 나눕니다</text><text x="380" y="98" fill="#536964" font-family="Malgun Gothic,system-ui,sans-serif" font-size="20" font-weight="550" text-anchor="middle">브라우저는 문서 설정을 읽고 화면에 본문을 표시합니다</text>
