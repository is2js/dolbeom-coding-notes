<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="js-title js-desc">
  <title id="js-title">버튼 클릭과 설명 펼치기</title>
  <desc id="js-desc">JavaScript가 id로 버튼과 설명을 찾고 버튼의 click 이벤트에 동작을 연결합니다. 클릭하면 설명 요소의 hidden 상태를 바꿔 화면에 보이거나 숨겨지게 합니다.</desc>
  <defs><linearGradient id="desk" x2=".8" y2="1"><stop stop-color="#fbf3df"/><stop offset="1" stop-color="#efe2c7"/></linearGradient><pattern id="grid" x="380" y="255" width="84" height="48" patternUnits="userSpaceOnUse" viewBox="0 0 84 48"><path d="M0 0 84 48M0 48 84 0" fill="none" stroke="#baa783" stroke-width="1.05"/></pattern></defs><rect x="2" y="2" width="756" height="546" rx="20" fill="url(#desk)" stroke="#c5b798" stroke-width="2"/><rect x="14" y="14" width="732" height="522" rx="14" fill="url(#grid)" opacity=".38"/>
  <text x="380" y="61" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="32" font-weight="750" text-anchor="middle">HTML의 이름에 동작을 연결합니다</text><text x="380" y="98" fill="#536964" font-family="Malgun Gothic,system-ui,sans-serif" font-size="20" font-weight="550" text-anchor="middle">클릭할 때 설명의 숨김 상태를 반대로 바꿉니다</text>
  <path d="M203 231 252 259m-12 -1 12 1 -4 -10" fill="none" stroke="#316f68" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 360 305 388m-12 -1 12 1 -4 -10" fill="none" stroke="#97632e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="52,130 64,123.14 599,123.14 587,130" fill="#fff8e9" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="587,130 599,123.14 599,224.14 587,231" fill="#aab6a5" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><rect x="52" y="130" width="535" height="101" rx="7" fill="#fff8e7" stroke="#2e4050" stroke-width="2.2"/><circle cx="96" cy="166" r="16" fill="#dce9d4" stroke="#2e4050" stroke-width="1.7"/><text x="96" y="172" fill="#2e4050" font-family="Consolas,monospace" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="126" y="173" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="23" font-weight="750" text-anchor="start">요소 찾기</text><text x="322" y="171" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">#toggle → button</text><text x="322" y="206" fill="#316f68" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">#detail → detail</text>
  <polygon points="105,259 117,252.14 652,252.14 640,259" fill="#fff8e9" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="640,259 652,252.14 652,353.14 640,360" fill="#aab6a5" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><rect x="105" y="259" width="535" height="101" rx="7" fill="#dce9d4" stroke="#2e4050" stroke-width="2.2"/><circle cx="149" cy="295" r="16" fill="#fff8e7" stroke="#2e4050" stroke-width="1.7"/><text x="149" y="301" fill="#2e4050" font-family="Consolas,monospace" font-size="17" font-weight="600" text-anchor="middle">2</text><text x="179" y="302" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="23" font-weight="750" text-anchor="start">클릭 연결</text><text x="375" y="300" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">click → 동작 실행</text><text x="375" y="335" fill="#316f68" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">addEventListener</text>
  <polygon points="158,388 170,381.14 705,381.14 693,388" fill="#fff8e9" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><polygon points="693,388 705,381.14 705,482.14 693,489" fill="#aab6a5" stroke="#2e4050" stroke-width="2.1" stroke-linejoin="round"/><rect x="158" y="388" width="535" height="101" rx="7" fill="#f4d9a4" stroke="#2e4050" stroke-width="2.2"/><circle cx="202" cy="424" r="16" fill="#dce9d4" stroke="#2e4050" stroke-width="1.7"/><text x="202" y="430" fill="#2e4050" font-family="Consolas,monospace" font-size="17" font-weight="600" text-anchor="middle">3</text><text x="232" y="431" fill="#2e4050" font-family="Malgun Gothic,system-ui,sans-serif" font-size="23" font-weight="750" text-anchor="start">상태 바꾸기</text><text x="428" y="429" fill="#2e4050" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">detail.hidden =</text><text x="428" y="464" fill="#316f68" font-family="Consolas,monospace" font-size="22" font-weight="600" text-anchor="start">!detail.hidden</text>
</svg>
