<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 카드 · Tailwind CSS와 Alpine.js</title>
  <link rel="stylesheet" href="../static/course.css">
  <script defer src="../static/alpine.js"></script>
</head>
<body class="bg-slate-100 p-6 font-sans">
  <article class="max-w-80 rounded-xl bg-white p-6" x-data="{ open: false }">
    <h1>Git</h1>
    <button type="button" class="cursor-pointer px-3 py-2" @click="open = !open" :aria-expanded="open.toString()" aria-controls="detail">설명 보기</button>
    <p id="detail" x-show="open" x-cloak>변경을 확인하고 기록합니다.</p>
  </article>
</body>
</html>
