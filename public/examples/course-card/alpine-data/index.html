<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 카드 · Tailwind CSS와 Alpine.js</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 p-6 font-sans">
  <main class="mx-auto max-w-3xl" x-data="{ lessons: [
    { title: '윈도우 터미널', minutes: 30, description: '폴더를 확인하고 탐색기와 오갑니다.' },
    { title: 'Git', minutes: 25, description: '변경을 확인하고 기록합니다.' }
  ] }">
    <h1 class="mb-4 text-2xl font-bold">나의 강의 카드</h1>
    <div class="grid gap-4 md:grid-cols-2">
      <template x-for="(lesson, index) in lessons" :key="index">
        <article class="max-w-80 rounded-xl bg-white p-6" x-data="{ open: false }">
          <h2 x-text="lesson.title">Git</h2>
          <p><span x-text="lesson.minutes"></span>분</p>
          <button type="button" class="cursor-pointer rounded border border-slate-500 bg-slate-100 px-3 py-2"
            @click="open = !open" :aria-expanded="open.toString()" :aria-controls="'detail-' + index"
            x-text="open ? '설명 접기' : '설명 보기'">설명 보기</button>
          <p :id="'detail-' + index" x-show="open" x-cloak x-text="lesson.description">변경을 확인하고 기록합니다.</p>
        </article>
      </template>
    </div>
  </main>
</body>
</html>
