<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 강의 카드</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-stone-100 text-slate-800">
  <main class="mx-auto max-w-3xl p-6">
    <h1 class="mb-4 text-2xl font-bold">나의 강의 카드</h1>
    <p>데이터 출처: {{ source }}</p>
    <ul class="grid gap-4 md:grid-cols-2">
      {% for lesson in lessons %}
      <li>
        <article class="rounded-xl bg-white p-6" x-data="{ open: false }">
          <h2 class="text-xl font-bold">{{ lesson.title }}</h2>
          <p>{{ lesson.minutes }}분</p>
          <button type="button" class="mt-4 rounded bg-slate-800 px-3 py-2 text-white"
                  @click="open = !open" :aria-expanded="open">설명 보기</button>
          <p class="mt-3" x-show="open" x-cloak>{{ lesson.description }}</p>
        </article>
      </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
