<dialog class="art-viewer" x-ref="artViewer" aria-labelledby="art-viewer-title" aria-describedby="art-viewer-caption" @close="onArtViewerClosed()" @cancel.prevent="closeArtViewer()" @click="if($event.target === $el)closeArtViewer()">
  <header class="art-viewer-header"><div><small>현재 설명의 그림</small><h2 id="art-viewer-title" x-text="artViewerTitle"></h2></div><button type="button" class="art-viewer-close" @click="closeArtViewer()" aria-label="그림 크게 보기 닫기" autofocus><span x-html="icon('close')"></span><span>닫기</span></button></header>
  <div class="art-viewer-toolbar"><div role="group" aria-label="그림 크기"><button type="button" @click="setArtViewerOriginal(false)" :aria-pressed="!artViewerOriginal">화면 맞춤</button><button type="button" @click="setArtViewerOriginal(true)" :aria-pressed="artViewerOriginal">원본 크기</button></div><button type="button" @click="illustrationPaused=!illustrationPaused" :disabled="prefersReducedMotion" :aria-pressed="illustrationPaused || prefersReducedMotion" x-text="prefersReducedMotion ? '정지 화면' : illustrationPaused ? '움직임 재생' : '움직임 멈춤'"></button></div>
  <div class="art-viewer-viewport" x-ref="artViewerViewport" :class="{'is-original':artViewerOriginal}" tabindex="0" aria-label="확대된 그림, 원본 크기에서는 스크롤하여 확인하세요"><div class="art-viewer-art workbench-illustration" :class="'topic-' + artViewerId + (artViewerStopped() ? ' is-motion-paused' : '')" role="img" :aria-label="illustrationDescription(artViewerId)" x-html="artViewerMarkup()"></div></div>
  <footer><p id="art-viewer-caption" x-text="artViewerId ? illustrationDescription(artViewerId) : ''"></p><small x-text="artViewerOriginal ? '그림 안에서 가로·세로로 스크롤해 보세요.' : '작은 글자는 원본 크기에서 확인하세요.'"></small></footer>
</dialog>
