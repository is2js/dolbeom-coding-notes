<dialog class="case-image-viewer" x-ref="caseImageViewer" aria-labelledby="case-image-viewer-title" @close="onCaseImageViewerClosed()" @cancel.prevent="closeCaseImageViewer()" @click="if($event.target === $el)closeCaseImageViewer()">
  <header class="case-image-viewer-header">
    <div><h2 id="case-image-viewer-title">사례 이미지 크게 보기</h2><p x-text="caseImageWidthFit ? '이미지를 가로에 맞춰 표시합니다. 아래로 스크롤해 확인하세요.' : '이미지 전체를 화면에 맞춰 표시합니다.'"></p></div>
    <button type="button" @click="closeCaseImageViewer()" aria-label="사례 이미지 닫기" autofocus>닫기 <span aria-hidden="true">×</span></button>
  </header>
  <div class="case-image-viewer-toolbar" role="group" aria-label="이미지 크기">
    <button type="button" @click="setCaseImageWidthFit(false)" :aria-pressed="!caseImageWidthFit">화면 맞춤</button>
    <button type="button" @click="setCaseImageWidthFit(true)" :aria-pressed="caseImageWidthFit">가로 맞춤</button>
  </div>
  <div class="case-image-viewer-viewport" :class="{'is-width-fit': caseImageWidthFit}" x-ref="caseImageViewport" tabindex="0" aria-label="사례 이미지 영역, 가로 맞춤에서 스크롤하여 확인하세요">
    <img :src="caseImageSrc || null" :alt="caseImageAlt">
  </div>
</dialog>
