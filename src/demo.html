<div class="demo-window" :class="'scene-'+step.scene">
                <div class="demo-titlebar"><div class="window-dots"><i></i><i></i><i></i></div><span x-text="sceneTitle"></span><span class="demo-badge">단계별 재현</span></div>
                <template x-if="['vscode','pycharm','code','git'].includes(step.scene)"><div class="demo-filebar"><span x-html="icon(step.scene==='git'?'git':'code')"></span><span x-text="step.fileName || 'README.md'"></span><span class="file-status">M</span></div></template>
                <div class="demo-content" :class="{'with-files': ['vscode','pycharm'].includes(step.scene)}">
                  <template x-if="['vscode','pycharm'].includes(step.scene)"><aside class="demo-files"><span>EXPLORER</span><b>⌄ DOLBEOM-NOTES</b><template x-for="(file,fileIndex) in (step.files.length ? step.files : ['src/','index.html','README.md'])" :key="fileIndex"><div :class="{selected:file===step.fileName}" x-text="file"></div></template></aside></template>
                  <div class="demo-editor-pane">
                    <template x-if="step.scene === 'browser'"><div class="demo-browser" x-html="browserPreview()"></div></template>
                    <div class="demo-code"><template x-for="(line,i) in codeLines" :key="i"><div class="code-line"><span class="line-number" x-text="i+1"></span><code x-text="line || ' '"></code><template x-if="codeCopyByLine[i]"><button type="button" class="command-copy demo-command-copy" :data-copy-value="codeCopyByLine[i].text" data-copy-kind="command" :aria-label="'명령어 복사: '+codeCopyByLine[i].text" title="이 명령어만 복사"><svg class="copy-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg><svg class="copied-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg><span class="command-copy-label">복사</span></button></template></div></template></div>
                    <div class="demo-output" x-show="step.output"><span>OUTPUT / 미리 작성된 결과</span><pre x-text="step.output"></pre></div>
                  </div>
                </div>
                <div class="demo-statusbar"><span x-text="step.language || 'Plain Text'"></span><span>UTF-8</span><span x-text="route === 'learn' ? '예제 '+(learningExampleIndex+1)+' / '+learningExamples.length : 'STEP '+(stepIndex+1)+' / '+lesson.steps.length"></span></div>
              </div>
              <p class="demo-footnote">실제 PC에서 명령을 실행하지 않는 강의용 재현 화면입니다.</p>
