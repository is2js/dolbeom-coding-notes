<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-git" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="topic-git-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#fffaf0" />
    <stop offset="1" stop-color="#eadcc0" />
    </linearGradient>
    <filter id="topic-git-shade" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>
  <style>
    .topic-art-git .lesson-signal { animation: git-topic-signal 4.8s linear var(--beat) infinite; }
    .topic-art-git .lesson-ping { animation: git-topic-ping 4.8s ease-in-out var(--beat) infinite; }
    @keyframes git-topic-signal {
      0%{stroke-dashoffset:.14;opacity:0} 8%,55%{opacity:1}
      65%,100%{stroke-dashoffset:-1;opacity:0}
    }
    @keyframes git-topic-ping { 0%,100%{opacity:.32} 22%,45%{opacity:.96} 63%{opacity:.32} }
    @media(prefers-reduced-motion:reduce) { .topic-art-git .art-motion { animation:none!important; } }
  </style>
