    <linearGradient id="github-server-front" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#fbf2dd"/><stop offset="1" stop-color="#e3d3b3"/></linearGradient>
    <linearGradient id="github-server-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f9a8b"/><stop offset="1" stop-color="#536e6d"/></linearGradient>
    <linearGradient id="github-card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fcf5e6"/><stop offset="1" stop-color="#f0e5ce"/></linearGradient>
    <filter id="github-ground-shadow" x="-25%" y="-80%" width="150%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
