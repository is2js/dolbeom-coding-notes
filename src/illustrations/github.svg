  <g font-family="Consolas,monospace" stroke="none" fill="#26334b" font-weight="700" text-anchor="middle"><text x="172" y="251" font-size="20">note.txt</text><text x="558" y="218" font-size="19">note.txt</text><text x="183" y="320" font-size="20">git-practice</text><text x="558" y="347" font-size="20">git-practice</text></g>
