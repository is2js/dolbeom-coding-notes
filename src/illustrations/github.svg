<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-github" aria-hidden="true" focusable="false">
  <defs><marker id="topic-github-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1l7 4-7 4" fill="none" stroke="#367d7b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>.topic-art-github .github-send{animation:topic-github-send 5.8s ease-in-out infinite}.topic-art-github .github-receive{animation:topic-github-receive 5.8s ease-in-out infinite}@keyframes topic-github-send{0%,10%{transform:translateX(0);opacity:.2}35%{transform:translateX(76px);opacity:1}50%,100%{transform:translateX(76px);opacity:.2}}@keyframes topic-github-receive{0%,45%{transform:translateX(0);opacity:.2}72%{transform:translateX(-76px);opacity:1}92%,100%{transform:translateX(-76px);opacity:.2}}@media(prefers-reduced-motion:reduce){.topic-art-github .art-motion{animation:none!important}}</style>
