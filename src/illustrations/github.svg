<svg xmlns="http://www.w3.org/2000/svg" class="topic-art-svg topic-art-github" viewBox="0 0 760 550" aria-hidden="true" focusable="false">
  <style>
    .github-left-signal{animation:github-left-flow 6.4s linear infinite}
    .github-right-signal{animation:github-right-flow 6.4s linear infinite}
    .github-review-signal{animation:github-review-flow 6.4s linear infinite}
    .github-contributor-left{animation:github-left-ready 6.4s ease-in-out infinite}
    .github-contributor-right{animation:github-right-ready 6.4s ease-in-out infinite}
    .github-server-light{animation:github-server-ready 6.4s ease-in-out infinite}
    .github-server-light-middle{animation-delay:.16s}.github-server-light-last{animation-delay:.32s}
    .github-merge-light{animation:github-merge-confirm 6.4s ease-in-out infinite}
    @keyframes github-left-flow{0%,7%{stroke-dashoffset:100;opacity:0}13%{opacity:.95}37%{stroke-dashoffset:0;opacity:.95}43%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes github-right-flow{0%,18%{stroke-dashoffset:100;opacity:0}24%{opacity:.95}46%{stroke-dashoffset:0;opacity:.95}52%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes github-review-flow{0%,49%{stroke-dashoffset:100;opacity:0}55%{opacity:.95}73%{stroke-dashoffset:0;opacity:.95}79%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes github-left-ready{0%{opacity:0}7%,15%{opacity:.9}25%,100%{opacity:0}}
    @keyframes github-right-ready{0%,10%{opacity:0}18%,26%{opacity:.9}36%,100%{opacity:0}}
    @keyframes github-server-ready{0%,38%{opacity:0}48%,59%{opacity:.85}70%,100%{opacity:0}}
    @keyframes github-merge-confirm{0%,70%{opacity:0}78%,88%{opacity:.9}99%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.github-left-signal,.github-right-signal,.github-review-signal,.github-contributor-left,.github-contributor-right,.github-server-light,.github-merge-light{animation:none!important}}
  </style>
  <defs>
