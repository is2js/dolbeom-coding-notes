<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-ide" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="topic-ide-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#fffaf0" />
    <stop offset="1" stop-color="#eadcc0" />
    </linearGradient>
    <filter id="topic-ide-shade" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
