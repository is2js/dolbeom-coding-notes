  <style>
    .topic-art-ide .lesson-signal { animation: ide-topic-signal 4.8s linear var(--beat) infinite; }
    .topic-art-ide .lesson-ping { animation: ide-topic-ping 4.8s ease-in-out var(--beat) infinite; }
    @keyframes ide-topic-signal {
      0%{stroke-dashoffset:.14;opacity:0} 8%,55%{opacity:1}
      65%,100%{stroke-dashoffset:-1;opacity:0}
    }
    @keyframes ide-topic-ping { 0%,100%{opacity:.32} 22%,45%{opacity:.96} 63%{opacity:.32} }
    @media(prefers-reduced-motion:reduce) { .topic-art-ide .art-motion { animation:none!important; } }
  </style>
