  <style>
    .topic-art-markdown .lesson-signal { animation: markdown-topic-signal 4.8s linear var(--beat) infinite; }
    .topic-art-markdown .lesson-ping { animation: markdown-topic-ping 4.8s ease-in-out var(--beat) infinite; }
    @keyframes markdown-topic-signal {
      0%{stroke-dashoffset:.14;opacity:0} 8%,55%{opacity:1}
      65%,100%{stroke-dashoffset:-1;opacity:0}
    }
    @keyframes markdown-topic-ping { 0%,100%{opacity:.32} 22%,45%{opacity:.96} 63%{opacity:.32} }
    @media(prefers-reduced-motion:reduce) { .topic-art-markdown .art-motion { animation:none!important; } }
  </style>
