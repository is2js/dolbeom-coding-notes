<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-markdown" aria-hidden="true" focusable="false">
  <defs>
    <filter id="topic-markdown-shadow" x="-15%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#26334b" flood-opacity=".12" />
    </filter>
  </defs>
  <style>.topic-art-markdown .art-motion{transform-box:fill-box;transform-origin:center}.topic-art-markdown .markdown-render{animation:topic-markdown-render 4s ease-in-out infinite}@keyframes topic-markdown-render{0%,100%{transform:translateX(0);opacity:.1}40%,65%{transform:translateX(43px);opacity:1}}@media(prefers-reduced-motion:reduce){.topic-art-markdown .art-motion{animation:none!important}}</style>
