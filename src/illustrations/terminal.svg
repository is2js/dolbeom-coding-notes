  <defs>
    <linearGradient id="topic-terminal-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#fffaf0" />
    <stop offset="1" stop-color="#eadcc0" />
    </linearGradient>
    <filter id="topic-terminal-shade" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="9" />
