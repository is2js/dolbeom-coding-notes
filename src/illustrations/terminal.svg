  <style>
    .topic-art-terminal .lesson-signal { animation: terminal-topic-signal 4.8s linear var(--beat) infinite; }
    .topic-art-terminal .lesson-ping { animation: terminal-topic-ping 4.8s ease-in-out var(--beat) infinite; }
    @keyframes terminal-topic-signal {
      0%{stroke-dashoffset:.14;opacity:0} 8%,55%{opacity:1}
      65%,100%{stroke-dashoffset:-1;opacity:0}
    }
    @keyframes terminal-topic-ping { 0%,100%{opacity:.32} 22%,45%{opacity:.96} 63%{opacity:.32} }
    @media(prefers-reduced-motion:reduce) { .topic-art-terminal .art-motion { animation:none!important; } }
  </style>
