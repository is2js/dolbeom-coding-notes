<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-terminal" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="terminal-case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf4e5"/><stop offset="1" stop-color="#d9ccb4"/></linearGradient>
    <linearGradient id="terminal-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#304b57"/><stop offset=".55" stop-color="#233b48"/><stop offset="1" stop-color="#1e303e"/></linearGradient>
    <linearGradient id="terminal-keybed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eae7d8"/><stop offset="1" stop-color="#c7cdbb"/></linearGradient>
    <filter id="terminal-shadow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="terminal-command-clip"><rect class="art-motion terminal-typed-mask" x="43" y="84" width="112" height="23"/></clipPath>
  </defs>
  <style>
    .terminal-typed-mask { animation: terminal-type 6.4s steps(18, end) infinite; }
    .terminal-caret { animation: terminal-caret 1.8s ease-in-out infinite, terminal-caret-position 6.4s steps(12, end) infinite; }
    .terminal-result { animation: terminal-result 6.4s ease-in-out infinite; }
    .terminal-indicator { animation: terminal-status 6.4s ease-in-out infinite; }
    @keyframes terminal-type { 0%,12% { width:0px; } 48%,88% { width:112px; } 99%,100% { width:0px; } }
    @keyframes terminal-caret { 0%,100% { opacity:.25; } 48%,60% { opacity:1; } }
    @keyframes terminal-caret-position { 0%,12% { x:45px; } 48%,88% { x:149px; } 99%,100% { x:45px; } }
    @keyframes terminal-result { 0%,45%,100% { opacity:.18; } 62%,88% { opacity:1; } }
    @keyframes terminal-status { 0%,44%,100% { opacity:.45; } 63%,88% { opacity:1; } }
  </style>
  <ellipse cx="382" cy="455" rx="216" ry="23" fill="#536e6d" opacity=".18" filter="url(#terminal-shadow)"/>
