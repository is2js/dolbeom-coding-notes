<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" class="topic-art-svg topic-art-web-tools-case" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="map-case-paper" x2=".8" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f1e4c5"/></linearGradient>
    <linearGradient id="map-case-sage" x2=".8" y2="1"><stop stop-color="#e8efdb"/><stop offset="1" stop-color="#b8cdb4"/></linearGradient>
    <linearGradient id="map-case-sky" x2=".8" y2="1"><stop stop-color="#e7f0e3"/><stop offset="1" stop-color="#a7c9be"/></linearGradient>
    <filter id="map-case-shadow" x="-.3" y="-.5" width="1.6" height="2"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    .topic-art-web-tools-case .map-case-marker { transform-box: fill-box; transform-origin: center bottom; animation: map-case-select 3.6s ease-in-out infinite; }
    .topic-art-web-tools-case .map-case-glow { transform-box: fill-box; transform-origin: center; animation: map-case-pulse 3.6s ease-in-out infinite; }
    .topic-art-web-tools-case .wedding-answer { transform-box: fill-box; transform-origin: center top; animation: wedding-answer-open 5.4s ease-in-out infinite; }
    .topic-art-web-tools-case .wedding-chevron { transform-box: fill-box; transform-origin: center; animation: wedding-chevron-turn 5.4s ease-in-out infinite; }
    @keyframes map-case-select { 0%, 60%, 100% { transform: translateY(0); } 25% { transform: translateY(-6px); } }
    @keyframes map-case-pulse { 0%, 100% { opacity: .35; } 35%, 65% { opacity: .8; } }
    @keyframes wedding-answer-open { 0%, 12%, 90%, 100% { transform: scaleY(.12); opacity: .35; } 32%, 72% { transform: scaleY(1); opacity: 1; } }
    @keyframes wedding-chevron-turn { 0%, 12%, 90%, 100% { transform: rotate(0); } 32%, 72% { transform: rotate(180deg); } }
    @media (prefers-reduced-motion: reduce) { .topic-art-web-tools-case .art-motion { animation: none; } }
  </style>

  <g stroke="#34434c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Isometric work surface and its shallow side faces. -->
    <path d="M83 313 371 478 681 300 393 135Z" fill="#6e5f41" stroke="none" opacity=".18" filter="url(#map-case-shadow)" transform="translate(0 14)"/>
    <path d="M83 313 371 478 681 300v14L371 492 83 327Z" fill="#a8bea5"/>
    <path d="m371 478 310-178v14L371 492Z" fill="#849f8b"/>
    <path d="M83 313 371 478 681 300 393 135Z" fill="url(#map-case-sage)"/>
    <path d="M89 313 393 139 675 300" fill="none" stroke="#fffdf2" stroke-width="1.4" opacity=".8"/>
    <g fill="none" stroke="#68867b" stroke-width="1.1" opacity=".24">
      <path d="m155 272 288 165m-216-206 288 165m-216-206 288 165m-216-206 288 165"/>
      <path d="M155 354 465 176m-238 219 310-178m-238 220 310-178"/>
    </g>

    <!-- Map window: its screen is flat, while the frame has visible depth. -->
    <g transform="translate(230 115)">
      <path d="m0 0 12-7 318 184-12 7Z" fill="#d6e4d0"/>
      <path d="m318 184 12-7v190l-12 7Z" fill="#7a9990"/>
      <g transform="matrix(1 .577 0 1 0 0)">
        <rect width="318" height="190" rx="11" fill="url(#map-case-paper)"/>
        <path d="M11 0h296q11 0 11 11v29H0V11Q0 0 11 0Z" fill="#d7e7d5"/>
        <circle cx="17" cy="20" r="4" fill="#c68b45" stroke="none"/>
        <circle cx="30" cy="20" r="4" fill="#72a893" stroke="none"/>
        <text x="49" y="27" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#34434c" stroke="none">돌범의 부동산 지도</text>
        <rect x="13" y="52" width="64" height="124" rx="7" fill="#fffaf0" stroke="#b9cabb" stroke-width="1.3"/>
        <rect x="20" y="61" width="50" height="21" rx="4" fill="#4f8878" stroke="none"/>
        <text x="45" y="75" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="11" font-weight="700" fill="#fffaf0" stroke="none">서울 ✓</text>
        <path d="M22 94h41m-41 13h33m-33 13h39m-39 13h29" fill="none" stroke="#98ae9e" stroke-width="2"/>
        <rect x="84" y="52" width="221" height="124" rx="7" fill="url(#map-case-sky)" stroke="#89a99c" stroke-width="1.5"/>
        <path d="m93 85 43-26 34 16 33-17 41 15 51-12v82l-42 23-42-17-45 17-37-19-36 15Z" fill="#e5ecd8" stroke="#aec5ae" stroke-width="1.5"/>
        <path d="m95 117 61-24 41 17 47-21 51 14m-160-41 18 84m51-80 7 84m44-77-5 77" fill="none" stroke="#b8cdbd" stroke-width="1.4"/>
        <path d="m99 154 48-24 34 12 39-20 38 14 39-18" fill="none" stroke="#fffaf0" stroke-width="6"/>
        <path d="m99 154 48-24 34 12 39-20 38 14 39-18" fill="none" stroke="#94aca4" stroke-width="1.2"/>
        <circle cx="209" cy="103" r="18" fill="#93c2a6" opacity=".45" stroke="none" class="art-motion map-case-glow"/>
        <g class="art-motion map-case-marker">
          <path d="M209 79c-10 0-17 7-17 16 0 12 17 22 17 22s17-10 17-22c0-9-7-16-17-16Z" fill="#377e78"/>
          <circle cx="209" cy="95" r="5" fill="#fff9e8" stroke="none"/>
        </g>
        <rect x="239" y="58" width="54" height="21" rx="5" fill="#fff8e7" stroke="#9cb6a6" stroke-width="1.2"/>
        <text x="266" y="73" text-anchor="middle" fill="#45685e" stroke="none" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12" font-weight="700">지역 선택</text>
      </g>
    </g>

    <!-- A second real case: an invitation, with a question and its unfolding answer. -->
    <g transform="translate(77 93)">
      <path d="m0 0 10-6 140 81-10 6Z" fill="#f2dfcb"/>
      <path d="m140 81 10-6v218l-10 6Z" fill="#ac9488"/>
      <g transform="matrix(1 .577 0 1 0 0)">
        <rect width="140" height="218" rx="12" fill="#fffaf0"/>
        <rect x="8" y="8" width="124" height="202" rx="8" fill="#f8ebe3" stroke="#d2b6a4" stroke-width="1.2"/>
        <path d="M70 51c-5-8-17-4-17 5 0 8 17 17 17 17s17-9 17-17c0-9-12-13-17-5Z" fill="#db9b8c" stroke="#a46964" stroke-width="1.5"/>
        <text x="70" y="92" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#4b5050" stroke="none">온라인 청첩장</text>
        <path d="M28 101h84" stroke="#d2b6a4" stroke-width="1.2"/>
        <rect x="18" y="110" width="104" height="30" rx="5" fill="#fffaf0" stroke="#b9a79a" stroke-width="1.2"/>
        <text x="27" y="129" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#465752" stroke="none">질문 보기</text>
        <path class="art-motion wedding-chevron" d="m105 121 5 5 5-5" fill="none" stroke="#518372" stroke-width="2"/>
        <g class="art-motion wedding-answer">
          <rect x="18" y="145" width="104" height="43" rx="5" fill="#e3eee0" stroke="#abc6b2" stroke-width="1.1"/>
          <path d="M28 157h77m-77 9h69m-69 9h49" fill="none" stroke="#8cae99" stroke-width="2"/>
        </g>
        <rect x="51" y="196" width="38" height="3" rx="1.5" fill="#c5ada0" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
