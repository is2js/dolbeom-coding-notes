      65%,100%{stroke-dashoffset:-1;opacity:0}
    }
    @keyframes web-tools-topic-ping { 0%,100%{opacity:.32} 22%,45%{opacity:.96} 63%{opacity:.32} }
    @media(prefers-reduced-motion:reduce) { .topic-art-web-tools .art-motion { animation:none!important; } }
