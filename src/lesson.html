<div class="lesson-flow-workspace">
  <!-- TOPIC_NAVIGATION -->

  <header class="lesson-flow-heading"><div><p class="eyebrow" x-text="String(lesson.number).padStart(2,'0') + '강 · ' + lesson.shortTitle + ' · ' + lessonDuration + '분'"></p><h1 x-text="learningTitle"></h1></div><p class="lesson-flow-position" aria-live="polite">현재 <strong x-text="learningPageIndex+1"></strong><span x-text="' / ' + learningPages.length"></span><b x-text="learningPhase"></b></p></header>

  <div class="lesson-reading-layout">

    <main id="lesson-main" class="lesson-visual-panel" tabindex="-1" x-ref="main" aria-label="현재 설명의 그림과 예제">
      <div class="lesson-visual-tabs" role="tablist" aria-label="현재 내용의 보기"><button type="button" role="tab" id="flow-art-tab" aria-controls="flow-art" :aria-selected="view === 'map'" @click="view='map'"><span x-html="icon('layers')"></span>설명 그림</button><button type="button" role="tab" id="flow-demo-tab" aria-controls="flow-demo" :aria-selected="view === 'demo'" @click="showLearningDemo()" x-show="learningExamples.length"><span x-html="icon('terminal')"></span>관련 예제 재현</button></div>
      <figure id="flow-art" role="tabpanel" aria-labelledby="flow-art-tab" class="lesson-visual-figure" x-show="view === 'map'"><div class="isometric-grid" aria-hidden="true"></div><div class="lesson-visual-art workbench-illustration" :class="'topic-' + learningIllustrationId + (illustrationMotionStopped ? ' is-motion-paused' : '')" :data-scene="learningIllustrationId" role="img" :aria-label="illustrationDescription(learningIllustrationId)" x-html="lessonIllustration(learningIllustrationId)"></div><figcaption><span class="status-dot" aria-hidden="true"></span><span x-text="illustrationCaption(learningIllustrationId)"></span></figcaption></figure>
      <section id="flow-demo" class="lesson-related-demo demo-stage" role="tabpanel" aria-labelledby="flow-demo-tab" x-show="view === 'demo' && learningExamples.length">
        <!-- SHARED_DEMO -->
      </section>
      <div class="lesson-example-picker" x-show="view === 'demo' && learningExamples.length"><label for="learning-example">현재 절의 예제</label><select id="learning-example" :value="String(stepIndex)" @change="stepIndex=Number($event.target.value)"><template x-for="(example,index) in learningExamples" :key="example.step.id"><option :value="String(example.index)" :selected="stepIndex === example.index" x-text="(index+1) + '. ' + example.step.title"></option></template></select><div><button type="button" @click="prevStep()" :disabled="learningExampleIndex === 0">←</button><span x-text="(learningExampleIndex+1) + ' / ' + learningExamples.length"></span><button type="button" @click="nextStep()" :disabled="learningExampleIndex === learningExamples.length-1">→</button><button type="button" @click="copyStep()">전체 코드 복사</button></div></div>
      <div class="lesson-art-tools" x-show="view === 'map'"><button type="button" class="art-expand-button" @click="openArtViewer($event)"><span x-html="icon('expand')"></span>그림 크게 보기</button><button type="button" @click="illustrationPaused=!illustrationPaused" :disabled="prefersReducedMotion" :aria-pressed="illustrationPaused || prefersReducedMotion" x-text="prefersReducedMotion ? '정지 화면' : illustrationPaused ? '그림 움직임 재생' : '그림 움직임 멈춤'"></button></div>
    </main>

    <article class="lesson-current-note" aria-labelledby="learning-current-title"><header><span class="lesson-current-label" x-text="learningPage.kind === 'case' ? '먼저 소개할 사례' : learningPage.kind === 'recap' ? '이 주제의 마무리' : '지금 설명할 본문'"></span><button type="button" class="lesson-edit-current" x-show="learningPage.kind !== 'recap'" @click="openEditor(learningPage.kind === 'section' ? learningPage.section.id : 'case')">이 내용 수정 ↗</button></header><h2 id="learning-current-title" x-text="learningTitle"></h2><p class="lesson-current-cue" x-text="learningCue"></p>
      <div class="lesson-current-prose" tabindex="0" aria-label="현재 강의 본문">
        <template x-if="learningPage.kind === 'case'"><div><span class="case-label" x-text="lesson.case.kind === 'real' ? '돌범의 실제 개발 사례' : '수업용 예시'"></span><div class="markdown-body" @click="openCaseImageFromEvent($event)" x-html="renderCourseCaseMarkdown(lesson.case.body)"></div><p class="lesson-current-question" x-html="markdownInline(lesson.case.question)"></p></div></template>
        <template x-if="learningPage.kind === 'section'"><div class="markdown-body" x-html="markdown(learningPage.section.body)"></div></template>
        <template x-if="learningPage.kind === 'recap'"><div><p class="lesson-recap-closing" x-text="lesson.closing"></p><ul class="checklist"><template x-for="(item,index) in lesson.checklist" :key="index"><li><span x-html="icon('check')"></span><span x-text="item"></span></li></template></ul><button type="button" class="complete-button" @click="toggleComplete()" x-text="isComplete ? '학습 완료 표시 취소' : '이 강의 학습 완료'"></button></div></template>
      </div>
      <footer><button type="button" @click="learningPage.kind === 'section' ? openSection(learningPage.section.id) : readerOpen=true">본문 크게 읽기 ↗</button><span x-show="learningPage.kind === 'section'" x-text="learningPage.section?.minutes + '분'"></span></footer>
    </article>
  </div>

  <nav class="lesson-flow-navigation" aria-label="강의 설명 이동"><button type="button" @click="moveLearningPage(-1)" :disabled="learningPageIndex === 0 && course.lessons[0].id === lessonId">← 이전 설명</button><div><small x-text="learningPageIndex === learningPages.length-1 ? '이 주제의 설명을 마쳤습니다' : '다음에 설명할 내용'"></small><strong x-text="learningNextTitle"></strong></div><button type="button" class="lesson-flow-next" @click="moveLearningPage(1)" :disabled="learningPageIndex === learningPages.length-1 && course.lessons.at(-1).id === lessonId" x-text="learningPage.kind === 'recap' ? '다음 주제 →' : '다음 설명 →'"></button></nav>

  <details class="lesson-extra-notes"><summary>학습 목표·주의할 점·참고 문서</summary><div class="lesson-extra-grid"><section><h2>학습 목표</h2><ul><template x-for="(item,index) in lesson.objectives" :key="index"><li x-text="item"></li></template></ul></section><section><h2>주의할 점</h2><template x-for="(item,index) in lesson.pitfalls" :key="index"><p><strong x-text="item.title"></strong><span x-text="item.body"></span></p></template></section><section><h2>참고 문서</h2><template x-for="(item,index) in lesson.references" :key="index"><a :href="item.url" target="_blank" rel="noopener noreferrer" x-text="item.title + ' ↗'"></a></template><button type="button" @click="readerOpen=true">용어·보충 노트까지 읽기 ↗</button></section></div></details>
</div>
