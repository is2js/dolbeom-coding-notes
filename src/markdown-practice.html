<section class="markdown-practice" x-data="markdownPractice(PRACTICE_BODY)" x-id="['practice-source', 'practice-preview']" aria-label="마크다운 실시간 연습">
  <header class="markdown-practice-header"><div><h3>마크다운 실시간 연습</h3><p>원문을 바꾸면 미리보기가 바로 달라집니다.</p></div><div class="markdown-practice-actions"><button type="button" @click="reset()" :disabled="!original">처음 원문</button><button type="button" @click="copySource()" :disabled="!source">원문 복사</button></div></header>
  <p class="markdown-practice-notice">연습 내용은 임시로만 유지되며 강의 원본이나 브라우저 저장 내용에 반영되지 않습니다. 페이지를 떠나면 사라집니다. 미리보기의 이미지는 강의에 포함된 파일만 표시됩니다.</p>
  <p class="markdown-practice-empty" x-show="!original">연습할 마크다운 예제가 없습니다. 강의 본문에 markdown 코드 블록을 추가해 주세요.</p>
  <div class="markdown-practice-grid"><div class="markdown-practice-input"><label :for="$id('practice-source')">마크다운 원문</label><textarea :id="$id('practice-source')" x-model="source" spellcheck="false" placeholder="여기에 마크다운을 입력하세요"></textarea></div><div class="markdown-practice-output"><h4 :id="$id('practice-preview')">즉시 미리보기</h4><div class="markdown-body" :aria-labelledby="$id('practice-preview')" x-html="preview"></div></div></div>
  <p class="markdown-practice-status" role="status" aria-live="polite" x-text="message"></p>
</section>
